name: Kinetic verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real physics, model, CLI, MCP parity and HTTP safety
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p evidence
          npm test | tee evidence/unit-tests.txt
          npm run build
      - name: Install recording browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Complete original browser, MCP and offline acceptance
        run: |
          set -euo pipefail
          python tests/browser.py | tee evidence/browser-tests.log
          python -c "import json; assert json.load(open('evidence/browser-results.json'))['success']"
      - name: Replay lab, historical feedback and ghost comparison
        run: |
          set -euo pipefail
          python tests/replay-browser.py | tee evidence/replay-tests.log
          python -c "import json; assert json.load(open('evidence/replay/results.json'))['success']"
      - name: Archive exact source and provenance
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          tar --exclude=./node_modules --exclude=./dist --exclude=./.kinetic --exclude=./evidence --exclude=./.git --exclude=__pycache__ -czf /tmp/kinetic-source.tgz .
          cp /tmp/kinetic-source.tgz evidence/kinetic-source.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinetic-v04-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kinetic-v04-build-${{ github.run_id }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
